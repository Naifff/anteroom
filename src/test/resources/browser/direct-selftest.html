<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Самопроверка личных сообщений</title>
<style>
  body { font: 14px/1.6 ui-monospace, monospace; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  .pass::before { content: "PASS "; color: #14532d; }
  .fail::before { content: "FAIL "; color: #7f1d1d; }
  .fail { color: #7f1d1d; }
  #total { font-weight: bold; margin-bottom: 1rem; }
</style>
</head>
<body>
<h1>Самопроверка личных сообщений</h1>
<p>Рассылка на всю колоду: получатель скрыт, слоты одной длины, свой слот один.
   Хранилище ключа устройства эта страница не трогает.</p>
<div id="total">выполняется…</div>
<div id="results"></div>

<script src="/vendor/libsodium-sumo.js"></script>
<script src="/vendor/libsodium-wrappers-sumo.js"></script>
<script type="module">
import { packEnvelopes, openSlot, signedPayload, DECK, SLOT, ENVELOPES } from '/js/direct.js';
import { dmKeysFrom } from '/js/identity.js';

const results = document.getElementById('results');
let passed = 0;
let failed = 0;

async function check(name, body) {
  const row = document.createElement('div');
  try {
    await body();
    row.className = 'pass';
    row.textContent = name;
    passed++;
  } catch (e) {
    row.className = 'fail';
    row.textContent = `${name} — ${e.message}`;
    failed++;
  }
  results.append(row);
}

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

function same(a, b) {
  return a.length === b.length && a.every((byte, i) => byte === b[i]);
}

await sodium.ready;

await check('колода всегда ровно 52 слота одной длины', () => {
  const key = sodium.crypto_aead_xchacha20poly1305_ietf_keygen();
  const alice = sodium.crypto_box_keypair();
  const packed = packEnvelopes(key, [[7, alice.publicKey]]);

  assert(packed.length === ENVELOPES, `вышло ${packed.length} байт вместо ${ENVELOPES}`);
  assert(ENVELOPES === DECK * SLOT, 'арифметика колоды разъехалась');
});

await check('получатель разворачивает свой слот', () => {
  const key = sodium.crypto_aead_xchacha20poly1305_ietf_keygen();
  const alice = sodium.crypto_box_keypair();
  const packed = packEnvelopes(key, [[7, alice.publicKey]]);

  assert(same(openSlot(packed, 7, alice), key), 'свой слот не открылся');
});

await check('чужой слот молчит', () => {
  const key = sodium.crypto_aead_xchacha20poly1305_ietf_keygen();
  const alice = sodium.crypto_box_keypair();
  const bob = sodium.crypto_box_keypair();
  const packed = packEnvelopes(key, [[7, alice.publicKey]]);

  assert(openSlot(packed, 7, bob) === null, 'чужим ключом открылся слот получателя');
  assert(openSlot(packed, 30, bob) === null, 'случайные байты выдали себя за конверт');
});

await check('настоящий конверт неотличим от случайного по виду', () => {
  // Сервер видит только байты. Ни длина слота, ни его содержимое не должны выделять
  // настоящий конверт среди 51 случайного.
  const key = sodium.crypto_aead_xchacha20poly1305_ietf_keygen();
  const alice = sodium.crypto_box_keypair();
  const packed = packEnvelopes(key, [[7, alice.publicKey]]);

  const real = packed.slice(7 * SLOT, 8 * SLOT);
  for (let card = 0; card < DECK; card++) {
    const slot = packed.slice(card * SLOT, (card + 1) * SLOT);
    assert(slot.length === real.length, `слот ${card} другой длины`);
  }
  // Нулевых слотов быть не может: незаполненный остаток выдал бы, где настоящий.
  for (let card = 0; card < DECK; card++) {
    const slot = packed.slice(card * SLOT, (card + 1) * SLOT);
    assert(slot.some((byte) => byte !== 0), `слот ${card} остался нулями`);
  }
});

await check('два настоящих конверта: получателю и себе', () => {
  // Иначе отправитель не прочитает собственную переписку.
  const key = sodium.crypto_aead_xchacha20poly1305_ietf_keygen();
  const alice = sodium.crypto_box_keypair();
  const bob = sodium.crypto_box_keypair();
  const packed = packEnvelopes(key, [[7, alice.publicKey], [30, bob.publicKey]]);

  assert(same(openSlot(packed, 7, alice), key), 'получатель не открыл');
  assert(same(openSlot(packed, 30, bob), key), 'отправитель не открыл свой слот');
});

await check('две рассылки одного текста не совпадают побайтно', () => {
  const alice = sodium.crypto_box_keypair();
  const key = sodium.crypto_aead_xchacha20poly1305_ietf_keygen();
  const first = packEnvelopes(key, [[7, alice.publicKey]]);
  const second = packEnvelopes(key, [[7, alice.publicKey]]);

  assert(!same(first, second), 'колода конвертов повторилась — sealed box перестал быть случайным');
});

await check('карта вне колоды отбивается', () => {
  const key = sodium.crypto_aead_xchacha20poly1305_ietf_keygen();
  const alice = sodium.crypto_box_keypair();
  let refused = false;
  try {
    packEnvelopes(key, [[52, alice.publicKey]]);
  } catch {
    refused = true;
  }
  assert(refused, '53-е место прошло, а колода на 52');
});

await check('подпись отправителя проверяется', () => {
  const sender = sodium.crypto_sign_keypair();
  const payload = signedPayload('room-1', 3, 7, 'привет');
  const signature = sodium.crypto_sign_detached(payload, sender.privateKey);

  assert(sodium.crypto_sign_verify_detached(signature, payload, sender.publicKey),
    'своя же подпись не сошлась');
});

await check('подпись не переносится в другую комнату и эпоху', () => {
  // Без комнаты и эпохи внутри подписанного подписанная реплика оставалась бы
  // действительной после ротации ключа и в чужой комнате.
  const sender = sodium.crypto_sign_keypair();
  const signature = sodium.crypto_sign_detached(signedPayload('room-1', 3, 7, 'привет'), sender.privateKey);

  assert(!sodium.crypto_sign_verify_detached(
    signature, signedPayload('room-2', 3, 7, 'привет'), sender.publicKey), 'подпись прошла в чужой комнате');
  assert(!sodium.crypto_sign_verify_detached(
    signature, signedPayload('room-1', 4, 7, 'привет'), sender.publicKey), 'подпись прошла в другой эпохе');
});

await check('ключ переписки свой на каждую эпоху и комнату', () => {
  const seed = sodium.randombytes_buf(32);
  const first = dmKeysFrom(seed, 'room-1', 1);
  const again = dmKeysFrom(seed, 'room-1', 1);
  const nextEpoch = dmKeysFrom(seed, 'room-1', 2);
  const otherRoom = dmKeysFrom(seed, 'room-2', 1);

  assert(same(first.publicKey, again.publicKey), 'вывод недетерминирован — восстановление из слов потеряет переписку');
  assert(!same(first.publicKey, nextEpoch.publicKey), 'эпоха не меняет ключ переписки');
  assert(!same(first.publicKey, otherRoom.publicKey), 'комната не меняет ключ переписки');
});

document.getElementById('total').textContent =
  failed === 0 ? `всё сошлось: ${passed}` : `провалов ${failed} из ${passed + failed}`;
</script>
</body>
</html>
