<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Фрагмент URL Referer и так не переносит, но и путь наружу отдавать незачем. -->
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Anteroom</title>
<style>
:root{
  --bg:#191817; --surface:#211F1E; --surface-hi:#2B2827;
  --ink:#E8E4DF; --ink-2:#8C8681; --ink-3:#5A5451; --ember:#D9542F;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;
  line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.app{width:100%;max-width:560px;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}

.top{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.room{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-right:auto}
.me-chip{display:flex;align-items:center;gap:7px;border:0;cursor:pointer;background:var(--surface);
  padding:6px 11px;border-radius:999px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.me-chip b{color:var(--ink);font-weight:600}
.me-chip:focus-visible,.reveal:focus-visible,button:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}

.feed{flex:1;overflow-y:auto;padding:6px 16px 8px;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}

/* Личное — отдельная вкладка, а не врезка в общую ленту: смешивать личное с общим
   значит однажды ответить не туда. */
.tabs{display:flex;gap:6px;padding:0 16px 4px}
.tab{border:0;cursor:pointer;background:none;color:var(--ink-3);font-family:var(--sans);
  font-size:13px;padding:6px 10px;border-radius:999px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink)}
/* Точка непрочитанного. Не --ember: акцент зарезервирован под необратимые действия,
   а «вам написали» к ним не относится. */
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);
  margin-left:6px;vertical-align:middle}
.thread .dot{margin-left:0;margin-right:2px;flex:0 0 6px}
.threadbar{display:flex;align-items:center;gap:8px;padding:0 16px 6px;font-size:13px;color:var(--ink-2)}
.back{border:0;cursor:pointer;background:var(--surface);color:var(--ink);border-radius:999px;
  width:28px;height:28px;font-size:14px;line-height:1}
.thread{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;cursor:pointer;
  background:var(--surface);color:var(--ink);border-radius:14px;padding:11px 13px;font-family:var(--sans);
  font-size:14.5px;margin-top:6px}
.thread:disabled{cursor:default;background:none;color:var(--ink-3)}
.thread .card{font-family:var(--mono);font-size:13px;min-width:3.4em}
.thread-card{font-family:var(--mono);font-size:13px;color:var(--ink-2);align-self:center;margin-right:auto}
.thread .last{color:var(--ink-3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine{align-self:flex-end}
.mine .who{text-align:right}
/* Свой пузырь чуть светлее. Акцентный --ember сюда не брать: он зарезервирован
   под необратимые действия, и «своё сообщение» на него никак не тянет. */
.mine .bubble{background:var(--surface-hi)}
.empty{color:var(--ink-3);font-size:13px;padding:18px 2px;line-height:1.5}
/* Ограничение ширины держится на строке, а не на пузыре. У .mine строка не
   растягивается (align-self:flex-end), и процент от неё самой браузер разрешает
   в минимальную ширину содержимого — то есть в самое длинное слово. Тогда каждое
   слово уезжает на свою строку. У строки же процент считается от ленты, а её
   ширина определённая. */
.msg{padding-top:12px;max-width:83%}
.who{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-bottom:3px}
.bubble{background:var(--surface);border-radius:16px;padding:9px 13px;font-size:15.5px;
  word-wrap:break-word;overflow-wrap:anywhere;display:inline-block;max-width:100%}
.bubble.bad{color:var(--ink-3);font-family:var(--mono);font-size:12.5px}
.file{display:flex;flex-direction:column;gap:2px}
.file .name{word-break:break-all}
.file .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
/* Оговорка стоит у каждого файла, а не один раз в справке: её место там, где человек
   решает открывать. Антивирусная проверка при сквозном шифровании невозможна в принципе,
   и умалчивать об этом нельзя. */
.file .warn{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.file .get{margin-top:6px;align-self:flex-start;border:0;cursor:pointer;background:var(--surface-hi);
  color:var(--ink);font-family:var(--sans);font-size:13px;padding:7px 12px;border-radius:10px}
.file .get:disabled{color:var(--ink-3);cursor:default}
.clip{width:36px;height:36px;flex:0 0 36px;border:0;border-radius:50%;cursor:pointer;
  background:var(--surface-hi);color:var(--ink-2);display:grid;place-items:center;font-size:16px}
.clip:disabled{color:var(--ink-3);cursor:default}

.composer{margin:6px 12px calc(12px + env(safe-area-inset-bottom));background:var(--surface);
  border-radius:24px;padding:7px 7px 7px 14px;display:flex;align-items:center;gap:8px}
.composer input{flex:1;background:none;border:0;outline:none;color:var(--ink);font-family:var(--sans);
  font-size:16px;padding:8px 0;min-width:0}
.composer input::placeholder{color:var(--ink-3)}
.icon{width:36px;height:36px;flex:0 0 36px;border:0;border-radius:50%;cursor:pointer;
  background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:15px}
.icon:disabled{background:var(--surface-hi);color:var(--ink-3);cursor:default}
.ttl-pick{border:0;cursor:pointer;background:var(--surface-hi);color:var(--ink-2);
  font-family:var(--mono);font-size:11.5px;padding:7px 10px;border-radius:999px;white-space:nowrap}
/* Угасание в абсолютном времени: последние десять минут независимо от того, был срок
   час или пять суток. В доле от срока долгоживущее висело бы полупрозрачным двое суток
   и выглядело поломкой. */
.msg{transition:opacity .8s linear}
.msg.fading{opacity:.45}
.ttl-tag{font-family:var(--mono);font-size:10px;color:var(--ink-3);padding:3px 4px 0}
.note{text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);padding:0 20px 10px;line-height:1.5}

.backdrop{position:absolute;inset:0;z-index:8;background:rgba(15,14,13,.62);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;z-index:9;background:var(--surface);
  border-radius:22px;padding:18px 18px 16px;max-height:88dvh;overflow-y:auto}
.sheet .t1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.sheet .fp{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);margin-top:6px;word-break:break-all;line-height:1.6}
.sheet h4{margin:18px 0 8px;font-size:12px;font-weight:600;color:var(--ink-2)}
.sheet p{margin:8px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.act{border:0;cursor:pointer;background:var(--surface-hi);color:var(--ink);font-family:var(--sans);
  font-size:13.5px;padding:9px 14px;border-radius:11px}
.act:disabled{color:var(--ink-3);cursor:default}
.act.danger{background:var(--ember);color:#fff;font-weight:600}
.words{font-family:var(--mono);font-size:13.5px;line-height:1.75;margin-top:10px;
  background:var(--bg);border-radius:12px;padding:12px 14px}
.words.masked{filter:blur(6px);opacity:.5;user-select:none}
.words ol{margin:0;padding-left:2.2em;columns:2;column-gap:18px}
.words li{padding-right:6px}
.countdown{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:8px}
.field{display:block;width:100%;margin-top:10px;background:var(--bg);border:0;border-radius:11px;
  color:var(--ink);font-family:var(--mono);font-size:13.5px;padding:11px 13px;outline:none;resize:vertical}
.field::placeholder{color:var(--ink-3)}
.msgline{margin-top:10px;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.msgline.bad{color:var(--ember)}
/* QR всегда чёрным по белому: инверсия под тёмную тему — первая причина, по которой
   сканер не видит код. Поле вокруг рисует сам генератор. */
.qr-wrap{margin-top:12px;background:#fff;border-radius:12px;padding:10px;display:flex;justify-content:center}
.qr-wrap canvas,.qr-wrap video{width:100%;max-width:260px;height:auto;display:block;border-radius:6px}
/* Видоискатель — холст, который мы рисуем сами, а не сам <video>.
   Причина не в красоте: кадры для распознавания и так проходят через холст, значит
   нарисованный кадр виден ровно тогда, когда он читается. Элемент video, положенный
   на белый фон, при неотрисовке даёт белый прямоугольник, неотличимый от сломанной
   камеры — на этом споткнулись при первой живой проверке.
   Видео остаётся в разметке размером 1px: display:none часть мобильных браузеров
   считает поводом остановить поток. */
.scan-wrap{background:var(--bg)}
.scan-wrap video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.code{font-family:var(--mono);font-size:26px;letter-spacing:.22em;text-align:center;
  margin-top:12px;color:var(--ink)}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="room" id="roomTitle" data-i18n="app.title" data-i18n-title="app.title"></div>
    <button class="me-chip" id="meChip" aria-haspopup="dialog"><b id="seats">…</b> · <span id="meFp">…</span></button>
  </div>

  <div class="tabs hidden" id="tabs">
    <button type="button" class="tab" id="tabRoom" aria-selected="true"><span data-i18n="tab.room"></span></button>
    <button type="button" class="tab" id="tabDm" aria-selected="false"><span data-i18n="tab.dm"></span><span class="dot hidden" id="dmDot"></span></button>
  </div>
  <div class="threadbar hidden" id="threadBar">
    <button type="button" class="back" id="back" data-i18n-aria="back.aria">←</button>
    <span id="threadWho"></span>
  </div>

  <div class="feed" id="feed"></div>
  <div class="feed hidden" id="dmPane"></div>

  <form class="composer" id="composer">
    <input id="text" data-i18n-placeholder="composer.placeholder" autocomplete="off" disabled>
    <button type="button" class="ttl-pick" id="ttlPick" data-i18n-aria="ttl.aria"></button>
    <button type="button" class="clip" id="attach" data-i18n-aria="attach.aria" disabled>⎘</button>
    <input type="file" id="file" class="hidden">
    <button class="icon" id="send" data-i18n-aria="send.aria" disabled>↑</button>
  </form>
  <div class="note" id="status" data-i18n="status.loading"></div>

  <div class="backdrop hidden" id="backdrop"></div>
  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" data-i18n-aria="sheet.title">
    <div class="t1" data-i18n="sheet.title"></div>
    <div class="fp" id="fingerprint"></div>
    <p id="iosHint" class="hidden" data-i18n="ios.hint"></p>

    <h4 data-i18n="export.head"></h4>
    <p data-i18n="export.why"></p>

    <div class="row">
      <button class="act" id="showWords" data-i18n="words.show"></button>
      <button class="act" id="saveFile" data-i18n="keyfile.save"></button>
      <button class="act" id="showQr" data-i18n="transfer.show"></button>
    </div>

    <div id="qrPanel" class="hidden">
      <div class="qr-wrap"><canvas id="qrCanvas" data-i18n-aria="transfer.aria"></canvas></div>
      <div class="code" id="transferCode"></div>
      <div class="countdown" id="qrCountdown"></div>
      <p data-i18n="transfer.why"></p>
      <div class="msgline hidden" id="qrMsg"></div>
    </div>

    <div id="wordsPanel" class="hidden">
      <div class="words masked" id="wordsBox"><ol id="wordsList"></ol></div>
      <div class="countdown" id="countdown"></div>
      <p data-i18n="words.why"></p>
    </div>

    <div id="filePanel" class="hidden">
      <input class="field" id="passphrase" type="password" data-i18n-placeholder="keyfile.passphrase" autocomplete="new-password">
      <div class="row">
        <button class="act" id="doSaveFile" data-i18n="keyfile.encrypt"></button>
      </div>
      <p data-i18n="keyfile.why"></p>
      <div class="msgline hidden" id="fileMsg"></div>
    </div>

    <h4 id="inviteHead" class="hidden" data-i18n="invite.head"></h4>
    <p id="inviteWhy" class="hidden" data-i18n="invite.why"></p>
    <div class="row hidden" id="inviteRow">
      <button class="act" id="makeInvite" data-i18n="invite.make"></button>
    </div>
    <textarea class="field hidden" id="inviteLink" rows="3" readonly></textarea>

    <h4 data-i18n="once.head"></h4>
    <p data-i18n="once.why"></p>
    <textarea class="field" id="onceText" rows="3" data-i18n-placeholder="once.placeholder"></textarea>
    <div class="row">
      <button class="act" id="makeOnce" data-i18n="once.make" disabled></button>
    </div>
    <textarea class="field hidden" id="onceLink" rows="3" readonly></textarea>

    <h4 id="moderHead" class="hidden" data-i18n="moder.head"></h4>
    <p id="moderWhy" class="hidden" data-i18n="moder.why"></p>
    <div id="moderList"></div>

    <h4 id="wipeHead" class="hidden" data-i18n="wipe.head"></h4>
    <p id="wipeWhy" class="hidden" data-i18n="wipe.why"></p>
    <div class="row hidden" id="wipeRow">
      <button class="act danger" id="doWipe" data-i18n="wipe.do"></button>
    </div>

    <h4 data-i18n="import.head"></h4>
    <p data-i18n="import.why"></p>
    <textarea class="field" id="importWords" rows="3" data-i18n-placeholder="import.words"></textarea>
    <input class="field" id="importFile" type="file" accept=".enc">
    <input class="field" id="importPass" type="password" data-i18n-placeholder="import.pass" autocomplete="off">
    <div class="row">
      <button class="act danger" id="doImport" data-i18n="import.do"></button>
      <button class="act" id="startScan" data-i18n="scan.start"></button>
      <button class="act" id="closeSheet" data-i18n="sheet.close"></button>
    </div>
    <div class="msgline hidden" id="importMsg"></div>

    <div id="scanPanel" class="hidden">
      <div class="qr-wrap scan-wrap hidden" id="scanBox">
        <canvas id="scanPreview"></canvas>
        <video id="scanVideo" playsinline muted></video>
      </div>
      <div class="msgline" id="scanMsg" data-i18n="scan.aim"></div>
      <input class="field hidden" id="scanCode" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" data-i18n-placeholder="scan.code">
      <div class="row">
        <button class="act danger hidden" id="doScanImport" data-i18n="import.do"></button>
        <button class="act" id="stopScan" data-i18n="scan.cancel"></button>
      </div>
    </div>

    <!-- Язык последним: он меняется один раз, а стоит выше — отодвигал бы вниз то,
         ради чего шторку открывают. -->
    <h4 data-i18n="lang.head"></h4>
    <div class="row" id="langRow"></div>
  </div>
</div>

<script src="/vendor/libsodium-sumo.js"></script>
<script src="/vendor/libsodium-wrappers-sumo.js"></script>
<script type="module">
import { newSeed, keysFromSeed, dmKeysFrom, saveSeed, loadSeed, saveServerKey, loadServerKey } from '/js/identity.js';
import { packEnvelopes, openSlot, signedPayload } from '/js/direct.js';
import { seedToWords, wordsToSeed } from '/js/words.js';
import { encryptSeed, decryptSeed } from '/js/keyfile.js';
import { encryptFile, decryptFile, MAX_PLAINTEXT } from '/js/attach.js';
import { t, translateError, applyStatic, currentLanguage, setLanguage, LANGUAGES } from '/js/i18n.js';

await sodium.ready;

const $ = (id) => document.getElementById(id);
const B64 = sodium.base64_variants.URLSAFE_NO_PADDING;

/* ---------- язык ---------- */

/*
 * Смена языка перезагружает страницу, а не перерисовывает её. Половина строк живёт
 * в уже нарисованных узлах — репликах ленты, списке переписок, отказах в статусе, — и
 * обойти их все на месте значило бы держать второй способ рисования интерфейса, который
 * расходится с первым при каждой правке. Перезагрузка ничего не теряет: ключ в IndexedDB,
 * комната во фрагменте, лента приезжает заново.
 */
applyStatic();

function drawLanguages() {
    const row = $('langRow');
    row.textContent = '';
    for (const [code, name] of LANGUAGES) {
        const button = document.createElement('button');
        button.className = 'act';
        button.textContent = name;
        button.disabled = code === currentLanguage();
        button.addEventListener('click', () => {
            setLanguage(code);
            location.reload();
        });
        row.append(button);
    }
}
drawLanguages();

/* ---------- личность ---------- */

let seed = await loadSeed();
if (!seed) {
  seed = newSeed();
  await saveSeed(seed);
}
let keys = keysFromSeed(seed);

function shortFingerprint(base64Key) {
  try {
    return sodium.to_hex(sodium.from_base64(base64Key, B64)).slice(0, 8);
  } catch {
    return base64Key.slice(0, 8);
  }
}

function showIdentity() {
  const hex = sodium.to_hex(keys.signPublic);
  $('meFp').textContent = hex.slice(0, 8);
  $('fingerprint').textContent = hex.match(/.{1,4}/g).join(' ');
}
showIdentity();

// Safari на iOS чистит хранилище примерно через неделю простоя, и личность исчезает сама.
// Установленным на домашний экран сайтам это не грозит, поэтому предупреждаем заранее.
const isIos = /iP(hone|ad|od)/.test(navigator.userAgent);
if (isIos && !navigator.standalone) {
  $('iosHint').classList.remove('hidden');
}

/* ---------- шторка ---------- */

function openSheet() {
  $('sheet').classList.remove('hidden');
  $('backdrop').classList.remove('hidden');
}

function closeSheet() {
  hideWords();
  // Камера и код переноса гаснут вместе со шторкой: оставить их работать за закрытым
  // экраном — значит показывать код дольше двух минут и держать камеру включённой.
  stopQr();
  stopScan();
  $('sheet').classList.add('hidden');
  $('backdrop').classList.add('hidden');
  $('wordsPanel').classList.add('hidden');
  $('filePanel').classList.add('hidden');
  $('qrPanel').classList.add('hidden');
  $('passphrase').value = '';
  $('importPass').value = '';
  $('importWords').value = '';
  // Файл сбрасывается тоже: иначе он останется выбранным, и следующее нажатие
  // «Заменить ключ» с пустыми словами молча вернёт прежнюю личность.
  $('importFile').value = '';
  $('importMsg').classList.add('hidden');
  $('fileMsg').classList.add('hidden');
}

$('meChip').addEventListener('click', openSheet);
$('closeSheet').addEventListener('click', closeSheet);
$('backdrop').addEventListener('click', closeSheet);

/* ---------- слова ---------- */

let hideTimer = null;
let tick = null;

function hideWords() {
  clearTimeout(hideTimer);
  clearInterval(tick);
  $('wordsBox').classList.add('masked');
  $('countdown').textContent = '';
  $('showWords').textContent = t('words.show');
  // Слова из DOM убираются, а не просто размываются: размытие это картинка,
  // а не защита, и в дереве страницы они остались бы текстом.
  $('wordsList').replaceChildren();
}

function revealWords() {
  const words = seedToWords(seed);
  $('wordsList').replaceChildren(...words.map((word) => {
    const item = document.createElement('li');
    item.textContent = word;
    return item;
  }));

  $('wordsPanel').classList.remove('hidden');
  $('wordsBox').classList.remove('masked');
  $('showWords').textContent = t('words.hide');

  let left = 15;
  $('countdown').textContent = t('words.countdown', { left });
  tick = setInterval(() => {
    left -= 1;
    $('countdown').textContent = t('words.countdown', { left });
  }, 1000);
  hideTimer = setTimeout(hideWords, 15000);
}

$('showWords').addEventListener('click', () => {
  const shown = !$('wordsBox').classList.contains('masked') && $('wordsList').children.length > 0;
  shown ? hideWords() : revealWords();
});

/* ---------- key.enc ---------- */

$('saveFile').addEventListener('click', () => {
  $('filePanel').classList.toggle('hidden');
  $('passphrase').focus();
});

$('doSaveFile').addEventListener('click', async () => {

/* ---------- перенос на устройство ---------- */

// Генератор и сканер вместе весят под треть мегабайта. Большинство ключ не переносит
// никогда, поэтому подтягиваются по нажатию, а не в общей загрузке страницы.
const loaded = new Map();
function loadScript(src) {
  if (!loaded.has(src)) {
    loaded.set(src, new Promise((resolve, reject) => {
      const tag = document.createElement('script');
      tag.src = src;
      tag.onload = resolve;
      tag.onerror = () => reject(new Error(src));
      document.head.append(tag);
    }));
  }
  return loaded.get(src);
}

let qrTimer = null;
let qrTick = null;

function stopQr() {
  clearTimeout(qrTimer);
  clearInterval(qrTick);
  const canvas = $('qrCanvas');
  canvas.getContext('2d')?.clearRect(0, 0, canvas.width, canvas.height);
  canvas.width = canvas.height = 0;
  $('transferCode').textContent = '';
  $('qrCountdown').textContent = '';
  $('showQr').textContent = t('transfer.show');
}

$('showQr').addEventListener('click', async () => {
  if ($('transferCode').textContent) {
    stopQr();
    $('qrPanel').classList.add('hidden');
    return;
  }

  const message = $('qrMsg');
  message.classList.remove('hidden', 'bad');
  message.textContent = t('transfer.preparing');
  $('qrPanel').classList.remove('hidden');

  try {
    await loadScript('/vendor/qrcode-generator.js');
    const { packTransfer, newTransferCode, TRANSFER_TTL_MS } = await import('/js/transfer.js');
    const { drawQr } = await import('/js/qr.js');

    const code = newTransferCode();
    await new Promise((resolve) => setTimeout(resolve, 0));
    const payload = await packTransfer(seed, code, Date.now());

    drawQr($('qrCanvas'), payload);
    $('transferCode').textContent = code.replace(/(\d{3})(\d{3})/, '$1 $2');
    $('showQr').textContent = t('transfer.hide');
    message.classList.add('hidden');

    // Две минуты — половина защиты шестизначного кода, поэтому срок гасит картинку
    // сам, без участия человека.
    let left = Math.round(TRANSFER_TTL_MS / 1000);
    $('qrCountdown').textContent = t('transfer.countdown', { left });
    qrTick = setInterval(() => {
      left -= 1;
      $('qrCountdown').textContent = t('transfer.countdown', { left });
    }, 1000);
    qrTimer = setTimeout(() => {
      stopQr();
      message.classList.remove('hidden');
      message.textContent = t('transfer.expired');
    }, TRANSFER_TTL_MS);
  } catch (e) {
    message.classList.add('bad');
    message.textContent = translateError(e);
  }
});

/* ---------- сканирование ---------- */

let camera = null;
let scanning = false;
let scannedPayload = null;

function stopScan() {
  scanning = false;
  // Треки гасятся явно: иначе камера остаётся включённой с горящим индикатором,
  // даже когда шторка закрыта.
  camera?.getTracks().forEach((track) => track.stop());
  camera = null;
  $('scanVideo').srcObject = null;
  // Холст обнуляется, а не просто прячется: последний кадр с камеры — это картинка
  // комнаты, в которой сидит человек, и держать её в памяти вкладки незачем.
  const preview = $('scanPreview');
  preview.getContext('2d')?.clearRect(0, 0, preview.width, preview.height);
  preview.width = preview.height = 0;
  $('scanBox').classList.add('hidden');
  $('scanPanel').classList.add('hidden');
  $('scanCode').value = '';
  $('scanCode').classList.add('hidden');
  $('doScanImport').classList.add('hidden');
  scannedPayload = null;
}

$('stopScan').addEventListener('click', stopScan);

$('startScan').addEventListener('click', async () => {
  $('scanPanel').classList.remove('hidden');
  const message = $('scanMsg');
  message.classList.remove('bad');
  message.textContent = t('scan.requesting');

  if (!navigator.mediaDevices?.getUserMedia) {
    message.classList.add('bad');
    message.textContent = t('scan.insecure');
    return;
  }

  try {
    await loadScript('/vendor/jsQR.js');
    const { readQr } = await import('/js/qr.js');

    camera = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = $('scanVideo');
    video.srcObject = camera;
    await video.play();
    message.textContent = t('scan.aim');

    // Один холст на два дела: он же видоискатель, он же кадр для распознавания.
    // Разводить их на два — значит однажды показать человеку не то, что читаем.
    const frame = $('scanPreview');
    const context = frame.getContext('2d', { willReadFrequently: true });
    $('scanBox').classList.remove('hidden');
    scanning = true;

    const tick = () => {
      if (!scanning) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        frame.width = video.videoWidth;
        frame.height = video.videoHeight;
        context.drawImage(video, 0, 0, frame.width, frame.height);

        const found = readQr(context.getImageData(0, 0, frame.width, frame.height));
        if (found) {
          scanning = false;
          scannedPayload = found;
          camera?.getTracks().forEach((track) => track.stop());
          camera = null;
          video.srcObject = null;
          // Видоискатель убирается целиком. Раньше на его месте оставался белый
          // прямоугольник, и успешное сканирование выглядело как отказавшая камера.
          $('scanBox').classList.add('hidden');
          // Снять «плохой» класс обязательно: иначе успех рисуется акцентным цветом,
          // оставшимся от прошлой ошибки, а он зарезервирован под необратимое.
          message.classList.remove('bad');
          message.textContent = t('scan.found');
          $('scanCode').classList.remove('hidden');
          $('doScanImport').classList.remove('hidden');
          $('scanCode').focus();
          return;
        }
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  } catch (e) {
    message.classList.add('bad');
    message.textContent = t('scan.failed', { error: translateError(e) });
  }
});

$('doScanImport').addEventListener('click', async () => {
  const message = $('scanMsg');
  message.classList.remove('bad');
  message.textContent = t('scan.checking');

  try {
    const { unpackTransfer } = await import('/js/transfer.js');
    await new Promise((resolve) => setTimeout(resolve, 0));
    const restored = await unpackTransfer(scannedPayload, $('scanCode').value.trim(), Date.now());

    await saveSeed(restored);
    seed = restored;
    keys = keysFromSeed(seed);
    showIdentity();

    stopScan();
    closeSheet();
  } catch (e) {
    message.classList.add('bad');
    message.textContent = translateError(e);
  }
});

/* ---------- импорт ---------- */

$('doImport').addEventListener('click', async () => {
  const message = $('importMsg');
  message.classList.remove('hidden', 'bad');
  message.textContent = t('import.checking');

  try {
    const typed = $('importWords').value.trim();
    const picked = $('importFile').files[0];

    if (typed) {

    } else {

    message.textContent = translateError(e);

/* ---------- комната ---------- */

const NONCE = sodium.crypto_aead_xchacha20poly1305_ietf_NPUBBYTES;

// Старшие карты переводятся: J/Q/K/A против В/Д/К/Т. Числа одинаковы везде, а вот
// «Т» на английской раскладке не читается никак.
const RANKS = ['2','3','4','5','6','7','8','9','10',
  t('card.j'), t('card.q'), t('card.k'), t('card.a')];
// Масти монохромные и различаются формой. Красный не вводить: акцентный цвет
// зарезервирован под необратимые действия.
// \uFE0E — селектор текстового начертания: без него ♦ и ♥ на части платформ
// подставляются эмодзи, то есть красными, а красный тут запрещён.
const SUITS = ['\u2660\uFE0E', '\u2663\uFE0E', '\u2666\uFE0E', '\u2665\uFE0E'];

function cardName(card) {
  return RANKS[card % 13] + ' ' + SUITS[Math.floor(card / 13)];
}

// Комната и ключ от неё живут во фрагменте: «<номер>.<ключ>». Фрагмент на сервер
// не уходит, поэтому ссылка целиком — это и есть приглашение. В фазе 6 её заменит
// одноразовый токен с эфемерным ключом.
let roomId = null;
let roomKey = null;
let epoch = 1;
let lastSeenId = 0;
let entered = false;
let inviteToken = null;
// Отказ в создании комнаты запоминается: иначе вкладка, которую развернули на пороге,
// при каждом переподключении пробует снова и заводит комнату молча — ровно в тот момент,
// когда устройство наконец впустили.
let createRefused = false;
let socket;

let pendingInvite = null;

function readLink() {
  const raw = location.hash.slice(1);
  if (!raw) return;

  // /join#<токен>.<эфемерный приватный ключ> — приглашение. Фрагмент на сервер не уходит,
  // поэтому токена нет ни в логах, ни в Referer.
  if (location.pathname.startsWith('/join')) {
    const dot = raw.indexOf('.');
    // Owner-инвайт первого запуска идёт без эфемерного ключа: комнаты ещё нет,
    // оборачивать нечего.
    inviteToken = dot < 0 ? raw : raw.slice(0, dot);
    pendingInvite = dot < 0 ? null : sodium.from_base64(raw.slice(dot + 1), B64);
    return;
  }
  // Ключ в ссылке необязателен: «#<номер>» — это возврат в свою комнату, ключ к которой
  // сервер отдаст обёрткой под наш X25519. С ключом — приглашение для нового участника.
  const dot = raw.indexOf('.');
  roomId = decodeURIComponent(dot < 0 ? raw : raw.slice(0, dot));
  if (dot >= 0) {
    roomKey = sodium.from_base64(raw.slice(dot + 1), B64);
  }
}

function writeLink() {
  // Только номер комнаты. Ключ в адресной строке больше не нужен — своя обёртка лежит
  // на сервере, — а лишний секрет в истории браузера и на чужом экране ни к чему.
  // Форма «#<номер>.<ключ>» ещё читается, но не пишется: делиться комнатой теперь
  // положено приглашением.
  const wanted = '#' + encodeURIComponent(roomId);
  if (location.hash !== wanted) {
    history.replaceState(null, '', location.pathname + location.search + wanted);
  }
}

function sealWith(key, plaintext) {
  const nonce = sodium.randombytes_buf(NONCE);
  const box = sodium.crypto_aead_xchacha20poly1305_ietf_encrypt(
    sodium.from_string(plaintext), null, null, nonce, key);
  const packed = new Uint8Array(nonce.length + box.length);
  packed.set(nonce);
  packed.set(box, nonce.length);
  return sodium.to_base64(packed, sodium.base64_variants.ORIGINAL);
}

function seal(plaintext) {
  return sealWith(roomKey, plaintext);
}

function open(payload) {
  const packed = sodium.from_base64(payload, sodium.base64_variants.ORIGINAL);
  return sodium.to_string(sodium.crypto_aead_xchacha20poly1305_ietf_decrypt(
    null, packed.slice(NONCE), null, packed.slice(0, NONCE), roomKey));
}

const cards = new Map();

// Сроки как в README: пять минут, час, сутки, двое суток, пять суток. По умолчанию 48 ч.
// Ключи выписаны целиком, а не собраны из числа: собранный ключ не проверить статически,
// и пропажа строки в словаре всплыла бы только на экране.
const TTL_CHOICES = [
  { seconds: 300, label: t('ttl.300') },
  { seconds: 3600, label: t('ttl.3600') },
  { seconds: 86400, label: t('ttl.86400') },
  { seconds: 172800, label: t('ttl.172800') },
  { seconds: 432000, label: t('ttl.432000') },
];
let ttlChoice = 3;

$('ttlPick').textContent = TTL_CHOICES[ttlChoice].label;
$('ttlPick').addEventListener('click', () => {
  ttlChoice = (ttlChoice + 1) % TTL_CHOICES.length;
  $('ttlPick').textContent = TTL_CHOICES[ttlChoice].label;
});

// Шифротекст держим при строке: когда ключ комнаты приедет обёрткой, лента
// перерисовывается на месте, а не перезапрашивается. Перезапрос задваивал реплики.
const shown = new Map();

/**
 * Конверт сообщения.
 *
 * Поле версии обязано быть с самого начала: без него смена криптосхемы ломает всё,
 * что уже отправлено, и миграцию некуда зацепить. Вложение — тот же конверт, только
 * вместо текста в нём ключ файла, имя и MIME-тип: в схеме БД их нет и быть не должно.
 */
const ENVELOPE_VERSION = 1;

function textEnvelope(body) {
  return JSON.stringify({ v: ENVELOPE_VERSION, t: 'text', body });
}

function fileEnvelope(id, key, file, size) {
  return JSON.stringify({
    v: ENVELOPE_VERSION, t: 'file', id,
    key: sodium.to_base64(key, B64),
    name: file.name,
    mime: file.type || 'application/octet-stream',
    size,
  });
}

function fill(bubble, ciphertext) {
  bubble.classList.remove('bad');
  bubble.textContent = '';

  if (!roomKey) {
    bubble.classList.add('bad');
    bubble.textContent = t('msg.nokey');
    return;
  }

  let envelope;
  try {
    envelope = JSON.parse(open(ciphertext));
  } catch {
    bubble.classList.add('bad');
    bubble.textContent = t('msg.undecryptable');
    return;
  }

  if (envelope.v !== ENVELOPE_VERSION) {
    bubble.classList.add('bad');
    bubble.textContent = t('msg.version', { got: envelope.v, known: ENVELOPE_VERSION });
    return;
  }

  if (envelope.t === 'file') {
    drawFile(bubble, envelope);
  } else {
    bubble.textContent = envelope.body;
  }
}

function humanSize(bytes) {
  if (bytes < 1024) return t('size.b', { n: bytes });
  if (bytes < 1024 * 1024) return t('size.kb', { n: Math.round(bytes / 1024) });
  return t('size.mb', { n: (bytes / 1024 / 1024).toFixed(1) });
}

function drawFile(bubble, envelope) {
  const box = document.createElement('div');
  box.className = 'file';

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = envelope.name;

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = humanSize(envelope.size);

  const warn = document.createElement('div');
  warn.className = 'warn';
  warn.textContent = t('file.warn');

  const get = document.createElement('button');
  get.className = 'get';
  get.textContent = t('file.get');
  get.addEventListener('click', () => download(envelope, get, meta));

  box.append(name, meta, warn, get);
  bubble.append(box);
}

/** Скачивание: шифротекст с сервера, расшифровка в памяти, blob-URL. */
async function download(envelope, button, meta) {
  button.disabled = true;
  meta.textContent = `${humanSize(envelope.size)} · ${t('file.downloading')}`;
  try {
    const response = await fetch(`/api/file/${encodeURIComponent(envelope.id)}`);
    if (!response.ok) {
      throw new Error(response.status === 404 ? 'file.gone' : 'file.notserved');
    }
    const ciphertext = new Uint8Array(await response.arrayBuffer());
    const plain = decryptFile(ciphertext, sodium.from_base64(envelope.key, B64));

    const url = URL.createObjectURL(new Blob([plain], { type: envelope.mime }));
    const link = document.createElement('a');
    link.href = url;
    link.download = envelope.name;
    link.click();
    // Ссылка на блоб держит копию файла в памяти вкладки, пока её не отозвать.
    setTimeout(() => URL.revokeObjectURL(url), 10000);

    meta.textContent = humanSize(envelope.size);
  } catch (e) {
    meta.textContent = `${humanSize(envelope.size)} · ${translateError(e)}`;
  } finally {
    button.disabled = false;
  }
}

function render(frame) {
  // Один и тот же id второй раз приходит при наложении догрузки на рассылку.
  if (shown.has(frame.id)) return;
  lastSeenId = Math.max(lastSeenId, frame.id);

  const row = document.createElement('div');
  // Своё справа, чужое слева — как в любом мессенджере. Сравнение по ключу подписи,
  // а не по карте: карта приезжает составом комнаты и до него ещё не известна.
  row.className = frame.sender === me() ? 'msg mine' : 'msg';
  const who = document.createElement('div');
  who.className = 'who';
  // Карта, а не отпечаток: она и есть имя участника в комнате. Отпечаток остаётся
  // якорем доверия и живёт в шторке, карта только подсказка памяти.
  const card = cards.get(frame.sender);
  who.textContent = card === undefined ? shortFingerprint(frame.sender) : cardName(card);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  fill(bubble, frame.ciphertext);

  row.append(who, bubble);
  shown.set(frame.id, { row, bubble, ciphertext: frame.ciphertext, sender: frame.sender, who,
    expiresAt: frame.expiresAt });
  $('feed').append(row);
  $('feed').scrollTop = $('feed').scrollHeight;
}

/** Последние десять минут жизни — независимо от того, был срок час или пять суток. */
const FADE_BEFORE_MS = 600000;

function tickExpiry() {
  const now = Date.now();
  for (const [id, entry] of shown) {
    const left = entry.expiresAt - now;
    if (left <= 0) {
      // Сервер это сообщение уже не отдаёт; открытая вкладка не должна показывать его
      // дольше, чем оно живёт.
      entry.row.remove();
      shown.delete(id);
      continue;
    }
    entry.row.classList.toggle('fading', left < FADE_BEFORE_MS);
  }

  // Личные подчиняются тем же срокам: отдельных правил для них не заводили.
  let dropped = false;
  for (const [device, line] of threads) {
    const alive = line.filter((entry) => entry.expiresAt > now);
    if (alive.length !== line.length) {
      threads.set(device, alive);
      dropped = true;
    }
  }
  if (dropped && view !== 'room') renderView();
}
setInterval(tickExpiry, 1000);

function redraw() {
  for (const entry of shown.values()) {
    fill(entry.bubble, entry.ciphertext);
    const card = cards.get(entry.sender);
    if (card !== undefined) {
      entry.who.textContent = cardName(card);
    }
  }
}

function ask(frame) {
  socket.send(JSON.stringify(frame));
}

const B64ORIG = sodium.base64_variants.ORIGINAL;

async function sha256Url(text) {
  const digest = await crypto.subtle.digest('SHA-256', sodium.from_string(text));
  return sodium.to_base64(new Uint8Array(digest), B64);
}

/**
 * Выпуск приглашения.
 *
 * Токен делается здесь и на сервер целиком не уходит: туда едет только SHA-256.
 * В ссылке — не ключ комнаты, а эфемерный приватный ключ инвайта; сам ключ комнаты
 * лежит на сервере обёрнутым под эфемерный публичный и исчезает вместе с погашением.
 * Иначе пересланная ссылка навсегда остаётся ключом от комнаты.
 */
$('makeInvite').addEventListener('click', async () => {
  if (!roomKey) return;

  const token = sodium.to_base64(sodium.randombytes_buf(32), B64);
  const ephemeral = sodium.crypto_box_keypair();

  await withProof({
    op: 'invite', room: roomId, tokenHash: await sha256Url(token),
    role: 'member', ttl: 86400, uses: 1,
    wrapped: sodium.to_base64(sodium.crypto_box_seal(roomKey, ephemeral.publicKey), B64ORIG),
  });

  const link = `${location.origin}/join#${token}.${sodium.to_base64(ephemeral.privateKey, B64)}`;
  $('inviteLink').classList.remove('hidden');
  $('inviteLink').value = link;
  $('inviteLink').select();
});

/**
 * Одноразовая записка.
 *
 * Ключ у неё свой, не ключ комнаты: ссылку отдают наружу, и ключом комнаты она бы
 * открывала всю переписку. На сервер уходит шифротекст и SHA-256 токена, а сам токен
 * с ключом живут во фрагменте — то есть ни в логах, ни в Referer их нет.
 */
$('makeOnce').addEventListener('click', async () => {
  const body = $('onceText').value;
  if (!body || !roomId) return;

  const token = sodium.to_base64(sodium.randombytes_buf(32), B64);
  const key = sodium.crypto_aead_xchacha20poly1305_ietf_keygen();

  ask({
    op: 'once', room: roomId, tokenHash: await sha256Url(token),
    ciphertext: sealWith(key, textEnvelope(body)),
    ttl: TTL_CHOICES[ttlChoice].seconds,
  });

  $('onceText').value = '';
  $('onceLink').classList.remove('hidden');
  $('onceLink').value = `${location.origin}/once#${token}.${sodium.to_base64(key, B64)}`;
  $('onceLink').select();
});

/* ---------- модерация ---------- */

/**
 * Состав комнаты с кнопкой исключения.
 *
 * Роль показывается только здесь, в момент действия, а не рядом с каждой репликой:
 * в ленте она ничего не значит и только сообщала бы, к кому идти с просьбами.
 */
function drawModeration(frame) {
  const mayIssue = frame.role === 'owner' || frame.role === 'admin';
  for (const id of ['moderHead', 'moderWhy']) {
    $(id).classList.toggle('hidden', !mayIssue);
  }
  for (const id of ['wipeHead', 'wipeWhy', 'wipeRow']) {
    $(id).classList.toggle('hidden', frame.role !== 'owner');
  }

  const list = $('moderList');
  list.textContent = '';
  if (!mayIssue) return;

  for (const seat of frame.members) {
    if (seat.device === me()) continue;
    const row = document.createElement('div');
    row.className = 'row';

    const who = document.createElement('span');
    who.className = 'thread-card';
    who.textContent = cardName(seat.card);

    const kick = document.createElement('button');
    kick.className = 'act danger';
    kick.textContent = t('moder.kick');
    kick.addEventListener('click', () => {
      // Подтверждение обязательно: действие необратимо, карта не вернётся в колоду.
      if (!confirm(t('moder.confirm', { card: cardName(seat.card) }))) {
        return;
      }
      ask({ op: 'remove', room: roomId, device: seat.device });
    });

    row.append(who, kick);
    list.append(row);
  }
}

$('doWipe').addEventListener('click', () => {
  if (!roomId) return;
  if (!confirm(t('wipe.confirm'))) {
    return;
  }
  ask({ op: 'wipe', room: roomId });
});

function onWiped() {
  for (const entry of shown.values()) {
    entry.row.remove();
  }
  shown.clear();
  threads.clear();
  seenDirect.clear();
  unread.clear();
  paintUnread();
  lastSeenId = 0;
  lastSeenDirect = 0;
  $('status').textContent = t('wipe.done');
  renderView();
}

/* ---------- пропуск на действие ---------- */

/*
 * Hashcash вместо капчи. Капча потребовала бы стороннего сервиса, то есть постороннего
 * наблюдателя за каждым входом; здесь вместо этого тратится время процессора. Соль
 * выдаёт сервер и гасит при предъявлении, поэтому решение нельзя ни заготовить, ни
 * использовать дважды.
 */
let workWaiting = null;

function askWork() {
  return new Promise((resolve, reject) => {
    workWaiting = { resolve, reject };
    ask({ op: 'work' });
  });
}

function solveWork(stamp) {
  for (let counter = 0; ; counter++) {
    const digest = sodium.crypto_hash_sha256(sodium.from_string(`${stamp.salt}:${counter}`));
    let zeros = 0;
    for (const byte of digest) {
      if (byte === 0) { zeros += 8; continue; }
      zeros += Math.clz32(byte) - 24;
      break;
    }
    if (zeros >= stamp.bits) return String(counter);
  }
}

/** Перебор синхронный и на доли секунды подвешивает вкладку — поэтому про него говорят вслух. */
async function withProof(frame) {
  const was = $('status').textContent;
  $('status').textContent = t('work.computing');
  try {
    const stamp = await askWork();
    if (stamp.bits > 0) {
      frame.salt = stamp.salt;
      frame.counter = solveWork(stamp);
    }
    ask(frame);
    $('status').textContent = was;
  } catch (e) {
    $('status').textContent = translateError(e);
  }
}

/* ---------- личные сообщения ---------- */

/*
 * Личное живёт внутри комнаты: карта существует только здесь, отдельного списка контактов
 * быть не может — он связал бы личности между комнатами.
 *
 * Получатель скрыт от сервера рассылкой на всю колоду. Мы разворачиваем ровно один слот —
 * свой, по номеру своей карты. Не подошло — сообщение не нам, и это всё, что мы узнаём.
 */
let view = 'room';          // room | dm | thread
let peer = null;            // устройство собеседника
let dmKeys = null;          // пара переписки на текущую комнату и эпоху
let myCard = null;
let directAllowed = true;
let lastSeenDirect = 0;

const dmPublic = new Map();     // устройство -> публичный ключ переписки этой эпохи
const threads = new Map();      // устройство собеседника -> список реплик
const seenDirect = new Set();
/**
 * Нити, где есть непрочитанное. Помечается то, что пришло не от нас и не в открытую
 * сейчас нить; снимается при входе в нить.
 *
 * Перезагрузка вкладки обнуляет lastSeenDirect, поэтому после неё вся переписка
 * приезжает заново и снова считается непрочитанной. Это честнее, чем показывать
 * пусто: в этой сессии её действительно ещё не открывали.
 */
const unread = new Set();

function paintUnread() {
  $('dmDot').classList.toggle('hidden', unread.size === 0);
}

const me = () => sodium.to_base64(keys.signPublic, B64);

function deviceByCard(card) {
  for (const [device, seat] of cards) {
    if (seat === card) return device;
  }
  return null;
}

function dmEnvelope(toCard, body) {
  // Подпись лежит внутри шифротекста, снаружи её нет: подпись рядом с сообщением выдала бы
  // отправителя серверу. Внутри она отвечает на другой вопрос — кто из участников это писал,
  // потому что ключ сообщения выбирает сам отправитель и «от кого» без подписи ничего не стоит.
  const signature = sodium.crypto_sign_detached(
    signedPayload(roomId, epoch, toCard, body), keys.signSecret);
  return JSON.stringify({
    v: ENVELOPE_VERSION, t: 'dm', from: me(), to: toCard, body,
    sig: sodium.to_base64(signature, B64),
  });
}

function sendDirect(body) {
  const peerCard = cards.get(peer);
  const peerKey = dmPublic.get(peer);
  if (peerCard === undefined || !peerKey) {
    $('status').textContent = t('dm.nokey');
    return;
  }

  const messageKey = sodium.crypto_aead_xchacha20poly1305_ietf_keygen();
  const envelopes = packEnvelopes(messageKey, [
    [peerCard, sodium.from_base64(peerKey, B64)],
    // Свой слот тоже настоящий: без него не прочитать собственную переписку.
    [myCard, dmKeys.publicKey],
  ]);

  ask({
    op: 'dm', room: roomId,
    ciphertext: sealWith(messageKey, dmEnvelope(peerCard, body)),
    envelopes: sodium.to_base64(envelopes, B64ORIG),
    ttl: TTL_CHOICES[ttlChoice].seconds,
  });
}

function onDirect(frame) {
  if (seenDirect.has(frame.id)) return;
  seenDirect.add(frame.id);
  lastSeenDirect = Math.max(lastSeenDirect, frame.id);

  if (!dmKeys || myCard === null) return;

  const messageKey = openSlot(sodium.from_base64(frame.envelopes, B64ORIG), myCard, dmKeys);
  if (!messageKey) return;   // не нам

  let note;
  try {
    const packed = sodium.from_base64(frame.ciphertext, B64ORIG);
    note = JSON.parse(sodium.to_string(sodium.crypto_aead_xchacha20poly1305_ietf_decrypt(
      null, packed.slice(NONCE), null, packed.slice(0, NONCE), messageKey)));
  } catch {
    return;
  }
  if (note.v !== ENVELOPE_VERSION || note.t !== 'dm') return;

  // Кто написал — по подписи, а не по слову «from». Иначе участник выдаёт себя за чужую карту.
  if (!cards.has(note.from)) return;
  const signed = signedPayload(roomId, epoch, note.to, note.body);
  try {
    if (!sodium.crypto_sign_verify_detached(
        sodium.from_base64(note.sig, B64), signed, sodium.from_base64(note.from, B64))) {
      return;
    }
  } catch {
    return;
  }

  const mine = note.from === me();
  const other = mine ? deviceByCard(note.to) : note.from;
  if (!other) return;

  if (!threads.has(other)) threads.set(other, []);
  threads.get(other).push({ id: frame.id, mine, body: note.body, expiresAt: frame.expiresAt });
  threads.get(other).sort((a, b) => a.id - b.id);

  if (!mine && !(view === 'thread' && peer === other)) {
    unread.add(other);
  }
  paintUnread();

  if (view !== 'room') renderView();
}

function drawThreadList() {
  const pane = $('dmPane');
  pane.textContent = '';

  const others = [...cards.keys()].filter((device) => device !== me());
  if (others.length === 0) {
    pane.append(note(t('dm.alone')));
    return;
  }

  others.sort((a, b) => cards.get(a) - cards.get(b));
  for (const device of others) {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'thread';

    const card = document.createElement('span');
    card.className = 'card';
    card.textContent = cardName(cards.get(device));

    if (unread.has(device)) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      row.append(dot);
    }

    const last = document.createElement('span');
    last.className = 'last';
    const line = threads.get(device);
    if (line && line.length) {
      const tail = line[line.length - 1];
      last.textContent = (tail.mine ? t('dm.you') : '') + tail.body;
    } else if (!dmPublic.get(device)) {
      // Переписку показываем всегда, даже когда ответить пока нечем: скрыть уже
      // полученное было бы хуже, чем объяснить, почему не отправляется.
      last.textContent = t('dm.never');
      row.disabled = true;
    } else {
      last.textContent = t('dm.write');
    }

    row.append(card, last);
    row.addEventListener('click', () => {
      peer = device;
      view = 'thread';
      renderView();
    });
    pane.append(row);
  }
}

function drawThread() {
  const pane = $('dmPane');
  pane.textContent = '';

  const line = threads.get(peer) || [];
  if (line.length === 0) {
    pane.append(note(t('dm.empty')));
  }

  for (const entry of line) {
    const row = document.createElement('div');
    row.className = entry.mine ? 'msg mine' : 'msg';

    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = entry.mine ? t('dm.me') : cardName(cards.get(peer));

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = entry.body;

    row.append(who, bubble);
    pane.append(row);
  }
  pane.scrollTop = pane.scrollHeight;
}

function note(text) {
  const box = document.createElement('div');
  box.className = 'empty';
  box.textContent = text;
  return box;
}

function renderView() {
  $('feed').classList.toggle('hidden', view !== 'room');
  $('dmPane').classList.toggle('hidden', view === 'room');
  $('tabs').classList.toggle('hidden', !roomId || !directAllowed || view === 'thread');
  $('threadBar').classList.toggle('hidden', view !== 'thread');
  $('tabRoom').setAttribute('aria-selected', String(view === 'room'));
  $('tabDm').setAttribute('aria-selected', String(view !== 'room'));
  $('composer').classList.toggle('hidden', view === 'dm');
  $('text').placeholder = t(view === 'thread' ? 'composer.placeholder.dm' : 'composer.placeholder');
  // Файлов в личных сообщениях нет: блоб один, и сервер видит, кто его качает. Текст
  // получателя скрывает, а вложение выдаёт — поддерживать это «с оговоркой» нельзя.
  $('attach').disabled = view !== 'room' || !roomKey;

  if (view === 'thread') {
    // Открыли нить — значит прочитали.
    unread.delete(peer);
    paintUnread();
    $('threadWho').textContent = t('dm.thread', { card: cardName(cards.get(peer)) });
    drawThread();
  } else if (view === 'dm') {
    drawThreadList();
  }
}

$('tabRoom').addEventListener('click', () => { view = 'room'; peer = null; renderView(); });
$('tabDm').addEventListener('click', () => { view = 'dm'; peer = null; renderView(); });
$('back').addEventListener('click', () => { view = 'dm'; peer = null; renderView(); });

/** Погашение: развернуть эфемерным ключом и тут же перешифровать под свой X25519. */
function onRedeemed(frame) {
  const secret = pendingInvite;
  pendingInvite = null;

  if (!frame.room) {
    // Owner-инвайт: комнаты нет, выдано право их заводить. Заводим первую сразу —
    // отдельного экрана «вы владелец, теперь создайте комнату» не нужно.
    history.replaceState(null, '', '/');
    roomKey = sodium.crypto_aead_xchacha20poly1305_ietf_keygen();
    withProof({ op: 'create', defaultTtl: 172800, maxTtl: 432000 });
    return;
  }

  const wrapped = sodium.from_base64(frame.wrapped, B64ORIG);
  roomKey = sodium.crypto_box_seal_open(wrapped, sodium.crypto_scalarmult_base(secret), secret);
  roomId = frame.room;

  // Своя обёртка под собственный ключ: с этого места инвайт больше не нужен.
  ask({
    op: 'wrap', room: roomId, epoch, device: sodium.to_base64(keys.signPublic, B64),
    wrapped: sodium.to_base64(sodium.crypto_box_seal(roomKey, keys.boxPublic), B64ORIG),
  });

  history.replaceState(null, '', `/#${encodeURIComponent(roomId)}`);
  entered = false;
  ask({ op: 'enter', room: roomId, since: 0 });
}

/**
 * Раздаёт ключ комнаты тем, у кого обёртки этой эпохи ещё нет.
 *
 * Обёртка — sealed box под X25519 участника: развернуть её может только он, а сервер
 * видит непрозрачный блоб. Раздать может любой, у кого ключ уже есть.
 */
function wrapForPending(pending) {
  if (!roomKey) return;
  for (const seat of pending) {
    if (!seat.box) continue;   // устройство ещё не прислало свой X25519
    ask({
      op: 'wrap', room: roomId, epoch, device: seat.device,
      wrapped: sodium.to_base64(
        sodium.crypto_box_seal(roomKey, sodium.from_base64(seat.box, B64)),
        sodium.base64_variants.ORIGINAL),
    });
  }
}

function onRoom(frame) {
  roomId = frame.room;
  epoch = frame.epoch;
  myCard = frame.card;
  directAllowed = frame.directAllowed !== false;
  cards.clear();
  dmPublic.clear();
  for (const seat of frame.members) {
    cards.set(seat.device, seat.card);
    if (seat.dm) dmPublic.set(seat.device, seat.dm);
  }

  // Ключ переписки выводится из seed, а не хранится: восстановление из 24 слов обязано
  // вернуть и личную переписку тоже. Публикуем при каждом входе — эпоха могла смениться.
  if (directAllowed) {
    dmKeys = dmKeysFrom(seed, roomId, epoch);
    const mine = sodium.to_base64(dmKeys.publicKey, B64);
    if (dmPublic.get(me()) !== mine) {
      ask({ op: 'dm-key', room: roomId, epoch, key: mine });
      dmPublic.set(me(), mine);
    }
  }

  $('roomTitle').textContent = t('app.title');
  // Показываем выпуск только владельцу и администраторам: показать всем — обещать
  // действие, которое сервер отклонит.
  const mayInvite = frame.role === 'owner' || frame.role === 'admin';
  for (const id of ['inviteHead', 'inviteWhy', 'inviteRow']) {
    $(id).classList.toggle('hidden', !mayInvite);
  }
  // Записку может выпустить любой участник: это способ отправить сообщение, а не право.
  $('makeOnce').disabled = false;
  drawModeration(frame);
  $('seats').textContent = `${cardName(frame.card)} · ${frame.seatsTaken}/52`;
  if (frame.deckSpent) {
    $('status').textContent = t('deck.spent');
  }

  // Вход в ленту — отдельным кадром и ровно один раз за соединение: до него сервер
  // не знает, что этой сессии надо слать рассылку, и своё же сообщение не вернётся.
  // Флаг обязателен: ответ на enter — такой же кадр room, и без него вышел бы цикл.
  if (!entered) {
    entered = true;
    ask({ op: 'enter', room: roomId, since: lastSeenId, sinceDirect: lastSeenDirect });
  }

  redraw();
  renderView();

  if (roomKey) {
    writeLink();
    wrapForPending(frame.needWrap);
  } else {
    // Ключа нет: просим свою обёртку. Так входит устройство, открывшее адрес без
    // фрагмента, — например восстановленное из слов.
    ask({ op: 'key', room: roomId, epoch });
  }
}

function onKey(frame) {
  if (!frame.wrapped) {
    $('status').textContent = t('key.pending');
    return;
  }
  roomKey = sodium.crypto_box_seal_open(
    sodium.from_base64(frame.wrapped, sodium.base64_variants.ORIGINAL),
    keys.boxPublic, keys.boxSecret);
  writeLink();
  // Лента успела нарисоваться нерасшифрованной, пока ключа не было.
  redraw();
}

/**
 * Вход: сервер даёт одноразовый вызов, браузер подписывает его ключом устройства.
 * Приватный ключ никуда не уходит, пароля нет.
 *
 * Вызов и подпись едут параметрами запроса, а не во фрагменте: секрета в них нет,
 * оба одноразовые. Фрагмент занят комнатой и ключом от неё.
 */
async function signedSocketUrl() {
  const response = await fetch('/api/challenge');
  if (!response.ok) {
    throw new Error(response.status === 429 ? 'auth.throttled' : 'auth.nochallenge');
  }
  const challenge = await response.json();
  const nonce = sodium.from_base64(challenge.nonce, B64);

  // Подпись сервера проверяется до того, как мы подпишем что-либо своим ключом:
  // она отличает наш сервер от подставленного посередине.
  const serverKey = sodium.from_base64(challenge.serverPublicKey, B64);
  if (!sodium.crypto_sign_verify_detached(sodium.from_base64(challenge.serverSignature, B64), nonce, serverKey)) {
    throw new Error('auth.unsigned');
  }
  await rememberServerKey(challenge.serverPublicKey);

  const signature = sodium.crypto_sign_detached(nonce, keys.signSecret);
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  return `${scheme}://${location.host}/ws`
    + `?nonce=${encodeURIComponent(challenge.nonce)}`
    + `&device=${encodeURIComponent(sodium.to_base64(keys.signPublic, B64))}`
    + `&signature=${encodeURIComponent(sodium.to_base64(signature, B64))}`;
}

/**
 * Отпечаток сервера запоминается при первом входе. Смена ключа — это либо переустановка
 * сервера, либо подмена, и молчать об этом нельзя.
 */
async function rememberServerKey(current) {
  const known = await loadServerKey();
  if (!known) {
    await saveServerKey(current);
  } else if (known !== current) {
    // Не блокируем вход: у самохостера это чаще переустановка, чем подмена. Но и молчать
    // нельзя — отличить одно от другого может только человек.
    $('status').textContent = t('auth.serverchanged');
  }
}

async function connect() {
  let url;
  try {
    url = await signedSocketUrl();
  } catch (e) {
    $('status').textContent = t('status.retry', { error: translateError(e) });
    setTimeout(connect, 5000);
    return;
  }

  socket = new WebSocket(url);

  socket.onopen = () => {
    $('status').textContent = t('status.open');
    $('text').disabled = false;
    $('send').disabled = false;
    $('attach').disabled = false;

    // Свой X25519 — первым делом: без него участнику нечем обернуть ключ комнаты.
    ask({ op: 'hello', box: sodium.to_base64(keys.boxPublic, B64) });

    entered = false;
    if (inviteToken) {
      ask({ op: 'redeem', token: inviteToken });
      inviteToken = null;
    } else if (!roomId && !createRefused) {
      roomKey = sodium.crypto_aead_xchacha20poly1305_ietf_keygen();
      withProof({ op: 'create', defaultTtl: 172800, maxTtl: 432000 });
    } else {
      ask({ op: 'enter', room: roomId, since: lastSeenId, sinceDirect: lastSeenDirect });
      entered = true;
    }
  };

  socket.onmessage = (event) => {
    const frame = JSON.parse(event.data);
    if (frame.op === 'room') onRoom(frame);
    else if (frame.op === 'msg') render(frame);
    else if (frame.op === 'direct') onDirect(frame);
    else if (frame.op === 'key') onKey(frame);
    else if (frame.op === 'redeemed') onRedeemed(frame);
    else if (frame.op === 'work') {
      workWaiting?.resolve(frame);
      workWaiting = null;
    }
    else if (frame.op === 'wiped') onWiped();
    else if (frame.op === 'upload-ready') {
      uploadWaiting?.resolve(frame);
      uploadWaiting = null;
    }
    else if (frame.op === 'error') {
      // Сравнение по коду, а не по тексту отказа: текст переводится и переписывается,
      // и ветка, завязанная на формулировку, однажды молча перестанет срабатывать.
      if (frame.code === 'invite-required') createRefused = true;
      const said = 'e.' + frame.code;
      // Отказ мог прийти на запрос пропуска — тогда ждать его дальше бессмысленно.
      uploadWaiting?.reject(new Error(said));
      uploadWaiting = null;
      workWaiting?.reject(new Error(said));
      workWaiting = null;
      $('status').textContent = t(said);
    }
  };

  socket.onclose = () => {
    $('status').textContent = t('link.lost');
    $('text').disabled = true;
    $('send').disabled = true;
    $('attach').disabled = true;
    // Пропуск на загрузку с прошлого соединения уже не придёт.
    uploadWaiting?.reject(new Error('link.down'));
    uploadWaiting = null;
    workWaiting?.reject(new Error('link.down'));
    workWaiting = null;
    setTimeout(connect, 1000);
  };
}

$('composer').addEventListener('submit', (event) => {
  event.preventDefault();
  const body = $('text').value;
  if (!body || !roomKey) return;

  if (view === 'thread') {
    sendDirect(body);
  } else {
    ask({ op: 'send', room: roomId, ciphertext: seal(textEnvelope(body)),
          ttl: TTL_CHOICES[ttlChoice].seconds });
  }
  $('text').value = '';
});

/* ---------- вложения ---------- */

// Пропуск на загрузку приезжает отдельным кадром, поэтому запрос ждёт ответа. Одна
// загрузка за раз: параллельные пришлось бы различать по id, а выигрыш нулевой.
let uploadWaiting = null;

function askUploadToken(size) {
  return new Promise((resolve, reject) => {
    uploadWaiting = { resolve, reject };
    ask({ op: 'upload', room: roomId, size, ttl: TTL_CHOICES[ttlChoice].seconds });
  });
}

$('attach').addEventListener('click', () => $('file').click());

$('file').addEventListener('change', async () => {
  const file = $('file').files[0];
  $('file').value = '';
  if (!file || !roomKey) return;

  if (file.size > MAX_PLAINTEXT) {
    $('status').textContent = t('file.toobig', { name: file.name });
    return;
  }

  $('attach').disabled = true;
  try {
    $('status').textContent = t('file.encrypting', { name: file.name });
    const plain = new Uint8Array(await file.arrayBuffer());
    // Ключ случайный на каждый файл. В сообщение он попадёт вместе с именем и типом —
    // всё это уже под ключом комнаты, и на сервере остаётся только размер и время.
    const { key, ciphertext } = encryptFile(plain);

    $('status').textContent = t('file.sending', { name: file.name });
    const permit = await askUploadToken(ciphertext.length);

    // Пропуск заголовком, а не параметром запроса: параметры попадают в access.log.
    const response = await fetch('/api/file', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream', 'X-Upload-Token': permit.token },
      body: ciphertext,
    });
    if (!response.ok) {
      throw new Error(response.status === 413 ? 'file.refused.big' : 'file.refused');
    }

    ask({ op: 'send', room: roomId, ttl: TTL_CHOICES[ttlChoice].seconds,
          ciphertext: seal(fileEnvelope(permit.id, key, file, plain.length)) });
    $('status').textContent = '';
  } catch (e) {
    $('status').textContent = `${file.name}: ${translateError(e)}`;
  } finally {
    uploadWaiting = null;
    $('attach').disabled = false;
  }
});

readLink();
connect();
</script>
</body>
</html>
