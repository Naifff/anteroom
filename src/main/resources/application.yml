app:
  data-dir: ./data
  file:
    # Потолок одного вложения в байтах шифротекста, 21 МБ. Порог в шифротексте, а не
    # в открытом тексте: иначе файл ровно по границе в 20 МБ получит ложный отказ
    # на служебных байтах secretstream. Не поднимать, не перечитав CLAUDE.md.
    max-bytes: 22020096
    # Квоты — страховка от накопления, основной механизм уборки всё равно TTL.
    room-quota-bytes: 2147483648
    disk-quota-bytes: 21474836480

spring:
  datasource:
    # foreign_keys: в SQLite внешние ключи выключены по умолчанию, и без этого флага
    #   ON DELETE CASCADE во всей схеме — просто комментарий.
    # В URL держать только те параметры, которые знает драйвер: неизвестный параметр
    #   xerial не отбрасывает и не ругается, а оставляет в имени файла — база тихо
    #   создаётся под именем «messenger.db?что-то=что-то».
    url: jdbc:sqlite:${app.data-dir:./data}/messenger.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
    hikari:
      # SQLite однопоточен на запись, пул из десятка соединений даёт только SQLITE_BUSY.
      maximum-pool-size: 4
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  undertow:
    # Запас над app.file.max-bytes, и менять эти два числа только вместе. По умолчанию
    # Undertow рубит тело на 2 МБ — молча для клиента и с обрывом соединения, — то есть
    # раньше, чем наша проверка успеет ответить 413 и убрать недописанный кусок.
    # Если опустить это ниже нашего потолка, вложения перестанут доходить без внятной причины.
    max-http-post-size: 22085632

logging:
  level:
    # Undertow пишет запрошенные пути; фрагмента URL в них нет по устройству HTTP,
    # но и полные пути в INFO нам не нужны.
    io.undertow: WARN
