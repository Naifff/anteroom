plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.anteroom'
version = '0.1.0-SNAPSHOT'

java {
    // Пин на 21, а не «что стоит в системе»: сборка не должна зависеть от JAVA_HOME разработчика.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Undertow вместо Tomcat. Исключение на всех конфигурациях, а не только на starter-websocket:
// Tomcat приезжает транзитивно из нескольких мест, и точечное исключение молча протухает.
configurations.configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-undertow'

    // Версия из BOM Spring Boot (11.7.2). Не поднимать до 12+, не проверив: там поддержку
    // SQLite вынесли из flyway-core в отдельный артефакт.
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.xerial:sqlite-jdbc'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// README документирует /opt/messenger/messenger.jar — имя артефакта держим тем же.
bootJar {
    archiveFileName = 'messenger.jar'
}

test {
    useJUnitPlatform()
}
